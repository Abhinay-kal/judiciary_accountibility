services:
  db:
    image: postgres:16
    container_name: justice-tracker-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: justice_tracker
    ports:
      - "${DB_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d justice_tracker"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-broker:
    image: redis:7-alpine
    container_name: justice-tracker-redis-broker
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cache:
    image: redis:7-alpine
    container_name: justice-tracker-redis-cache
    ports:
      - "6380:6380"
    command: ["redis-server", "--port", "6380", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: justice-tracker-backend
    env_file:
      - .env
    environment:
      AUTO_SEED_DB: "true"
    depends_on:
      db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["sh", "/app/bootstrap.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  celery-worker:
    build:
      context: ./backend
    container_name: justice-tracker-celery-worker
    env_file:
      - .env
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO
    depends_on:
      backend:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 10

  celery-beat:
    build:
      context: ./backend
    container_name: justice-tracker-celery-beat
    env_file:
      - .env
    command: celery -A app.celery_app.celery_app beat --loglevel=INFO
    depends_on:
      backend:
        condition: service_healthy
      celery-worker:
        condition: service_started
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os._exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: justice-tracker-frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
